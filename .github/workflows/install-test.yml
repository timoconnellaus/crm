# Real install, upgrade and rollback in a dedicated Cloudflare test account (stage 8, AC3/AC4).
#
#   1. install release N with `create-relationship-os` (storing an update token)
#   2. smoke test it: sign-in, create a person, MCP handshake, a runtime extension (Playwright)
#   3. a forced failing migration: `ros upgrade` to a local bundle whose last migration fails;
#      it must roll back to N with the data restored
#   4. upgrade N → N+1 through the self-updater (Settings → Updates), or with `ros upgrade` when
#      N+1 is the release being built (not published yet); data and the extension must survive
#   5. tear everything down
#
# Needs the repository secrets CF_TEST_ACCOUNT_ID and CF_TEST_API_TOKEN, created by a person with
# scripts/setup-ci-cloudflare.sh. Without them every job is skipped and the workflow passes.
name: Install test

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: "Release N to install first (default: the stable release before to_version)"
        required: false
      to_version:
        description: "Release N+1 to upgrade to (default: the newest stable release)"
        required: false
  schedule:
    - cron: "17 4 * * *"
  workflow_call:
    inputs:
      to_version:
        type: string
        required: true
      bundle_artifact:
        description: "An artifact holding relationship-os-<to_version>.tar.gz and SHA256SUMS (an unpublished release)"
        type: string
        required: false
    secrets:
      CF_TEST_ACCOUNT_ID:
        required: false
      CF_TEST_API_TOKEN:
        required: false

concurrency:
  # One run at a time: they share the test account.
  group: install-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Test account configured?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          ACCOUNT: ${{ secrets.CF_TEST_ACCOUNT_ID }}
          TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
        run: |
          if [[ -n "$ACCOUNT" && -n "$TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_TEST_ACCOUNT_ID / CF_TEST_API_TOKEN are not set; skipping the real-account install test. Run scripts/setup-ci-cloudflare.sh to create them."
          fi

  install-upgrade-rollback:
    name: Install, upgrade, rollback, teardown
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TEST_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_TEST_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @relationship-os/app exec playwright install --with-deps chromium
      - name: Build the CLI
        run: pnpm --filter create-relationship-os build

      - name: Get the unpublished release bundle
        if: inputs.bundle_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.bundle_artifact }}
          path: release-bundle

      - name: Pick N and N+1
        id: versions
        run: |
          to="${{ inputs.to_version }}"
          from="${{ inputs.from_version }}"
          stable=$(gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName --jq '.[].tagName' | sed 's/^v//')
          if [[ -z "$to" ]]; then to=$(echo "$stable" | head -n1); fi
          if [[ -z "$from" ]]; then from=$(echo "$stable" | grep -vx "$to" | head -n1 || true); fi
          if [[ -z "$to" ]]; then echo "::notice::No release published yet; nothing to install."; fi
          echo "to=$to" >> "$GITHUB_OUTPUT"
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "N=$from N+1=$to"

      - name: Clean the test account (an earlier run may have failed)
        if: steps.versions.outputs.to != ''
        run: node packages/create-relationship-os/dist/cli.js uninstall --yes || true

      - name: Install N (or N+1 when there is no N)
        if: steps.versions.outputs.to != ''
        id: install
        run: |
          version="${{ steps.versions.outputs.from || steps.versions.outputs.to }}"
          extra=()
          if [[ -z "${{ steps.versions.outputs.from }}" && -d release-bundle ]]; then extra+=(--bundle-dir release-bundle); fi
          node packages/create-relationship-os/dist/cli.js --yes --version "$version" --store-update-token --wait "${extra[@]}"
          host=$(node packages/create-relationship-os/dist/cli.js status --json | jq -r .state.hostname)
          echo "url=https://$host" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Smoke test (sign-in, a person, MCP handshake, a runtime extension)
        if: steps.versions.outputs.to != ''
        working-directory: apps/app
        env:
          LIVE_BASE_URL: ${{ steps.install.outputs.url }}
          LIVE_PHASE: install
          LIVE_EXPECT_VERSION: ${{ steps.install.outputs.version }}
        run: pnpm exec playwright test -c playwright.live.config.ts

      - name: A failing migration rolls back to N
        if: steps.versions.outputs.from != ''
        run: |
          from="${{ steps.versions.outputs.from }}"
          IFS=. read -r major minor patch <<< "${from%%-*}"
          broken="$major.$minor.$((patch + 1))-beta.9999"
          printf "UPDATE core_person SET display_name = 'wiped by a broken release';\nUPDATE core_meta SET value = '9998' WHERE key = 'schema_version';\n" > packages/db/migrations/9998_install_test_wipe.sql
          printf "INSERT INTO install_test_table_that_does_not_exist VALUES (1);\nUPDATE core_meta SET value = '9999' WHERE key = 'schema_version';\n" > packages/db/migrations/9999_install_test_fail.sql
          sed -i 's/export const CORE_SCHEMA_VERSION = [0-9]*;/export const CORE_SCHEMA_VERSION = 9999;/' packages/db/src/migrate.ts
          node scripts/release/build-release.ts --version "$broken" --out broken-release
          git checkout -- packages/db/src/migrate.ts
          rm packages/db/migrations/9998_install_test_wipe.sql packages/db/migrations/9999_install_test_fail.sql
          set +e
          node packages/create-relationship-os/dist/cli.js upgrade --yes --version "$broken" --bundle-dir broken-release --unverified | tee upgrade.log
          code=${PIPESTATUS[0]}
          set -e
          if [[ "$code" == "0" ]]; then echo "::error::the broken release was not refused"; exit 1; fi
          grep -q "Rolled back to $from" upgrade.log

      - name: Data restored after the rollback
        if: steps.versions.outputs.from != ''
        working-directory: apps/app
        env:
          LIVE_BASE_URL: ${{ steps.install.outputs.url }}
          LIVE_PHASE: verify
          LIVE_EXPECT_VERSION: ${{ steps.versions.outputs.from }}
        run: pnpm exec playwright test -c playwright.live.config.ts

      - name: Upgrade N → N+1 through the self-updater
        if: steps.versions.outputs.from != '' && inputs.bundle_artifact == ''
        working-directory: apps/app
        env:
          LIVE_BASE_URL: ${{ steps.install.outputs.url }}
          LIVE_PHASE: self-update
          LIVE_TARGET_VERSION: ${{ steps.versions.outputs.to }}
          LIVE_EXPECT_VERSION: ${{ steps.versions.outputs.to }}
        run: pnpm exec playwright test -c playwright.live.config.ts

      - name: Upgrade N → N+1 (unpublished release) with ros upgrade
        if: steps.versions.outputs.from != '' && inputs.bundle_artifact != ''
        run: |
          node packages/create-relationship-os/dist/cli.js upgrade --yes --version "${{ steps.versions.outputs.to }}" --bundle-dir release-bundle

      - name: Data and the runtime extension survived
        if: steps.versions.outputs.from != ''
        working-directory: apps/app
        env:
          LIVE_BASE_URL: ${{ steps.install.outputs.url }}
          LIVE_PHASE: verify
          LIVE_EXPECT_VERSION: ${{ steps.versions.outputs.to }}
        run: pnpm exec playwright test -c playwright.live.config.ts

      - name: Tear down
        if: always() && steps.versions.outputs.to != ''
        run: node packages/create-relationship-os/dist/cli.js uninstall --yes

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: install-test-report
          path: |
            apps/app/playwright-report
            apps/app/test-results
            upgrade.log
          retention-days: 7
